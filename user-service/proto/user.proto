syntax = "proto3";

package user;

service UserService {
  rpc GetUserById(UserIdRequest) returns (UserResponse);
}

message UserIdRequest {
  string userId = 1;
}

message UserResponse {
  string id = 1;
  string name = 2;
  string email = 3;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;  // e.g. "SERVING"
}
