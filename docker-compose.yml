version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  user-service:
    build: ./user-service
    container_name: user-service
    volumes:
      - ./user-service:/app       # Mount code for hot reload
      - /app/node_modules
    ports:
      - "3001:3001"
      - "50051:50051"
      - "9229:9229"              # Debug port
    depends_on:
      - mongo
    environment:
      NODE_ENV: development

  product-service:
    build: ./product-service
    container_name: product-service
    volumes:
      - ./product-service:/app
      - /app/node_modules
    ports:
      - "3002:3002"
      - "50052:50052"
      - "9228:9228"              # Debug port (unique per service)
    depends_on:
      - mongo
    environment:
      NODE_ENV: development

  order-service:
    build: ./order-service
    container_name: order-service
    volumes:
      - ./order-service:/app
      - /app/node_modules
    ports:
      - "3003:3003"
      - "50053:50053"
      - "9230:9230"              # Debug port
    depends_on:
      - mongo
      - user-service
      - product-service
    environment:
      NODE_ENV: development

volumes:
  mongo_data:
