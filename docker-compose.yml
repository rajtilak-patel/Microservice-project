version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  user-service:
    build: ./user-service
    container_name: user-service
    volumes:
      - ./user-service:/app
      - /app/node_modules
    ports:
      - "3001:3001"
      - "50051:50051"
      - "9100:9100"        # 🔥 Prometheus metrics
      - "9229:9229"
    depends_on:
      - mongo
    environment:
      NODE_ENV: development

  product-service:
    build: ./product-service
    container_name: product-service
    volumes:
      - ./product-service:/app
      - /app/node_modules
    ports:
      - "3002:3002"
      - "50052:50052"
      - "9101:9100"        # 🔥 Prometheus metrics
      - "9228:9228"
    depends_on:
      - mongo
    environment:
      NODE_ENV: development

  order-service:
    build: ./order-service
    container_name: order-service
    volumes:
      - ./order-service:/app
      - /app/node_modules
    ports:
      - "3003:3003"
      - "50053:50053"
      - "9102:9100"        # 🔥 Prometheus metrics
      - "9230:9230"
    depends_on:
      - mongo
      - user-service
      - product-service
    environment:
      NODE_ENV: development

  # 🔥 PROMETHEUS
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - user-service
      - product-service
      - order-service

volumes:
  mongo_data:
