apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - yourdomain.com
      secretName: tls-secret
  rules:
    - host: yourdomain.com
      http:
        paths:
          - path: /user
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 5000
          - path: /product
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 5001
          - path: /order
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 5002
